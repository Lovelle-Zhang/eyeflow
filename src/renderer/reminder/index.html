<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>EyeFlow Next · reminder</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/capsule.css" />
    <link rel="stylesheet" href="reminder.css" />
  </head>
  <body>
    <div class="stage">
      <div id="capsule" class="lumpill rem">
        <div id="face" class="mira-face">
          <span class="mira-face__eye"></span>
          <span class="mira-face__eye"></span>
          <span class="mira-face__dot"></span>
        </div>
        <div class="rem__body">
          <div id="text" class="rem__text">眼睛歇歇？看看远处。</div>
          <div id="track" class="rem__track"><div id="fill" class="rem__fill"></div></div>
        </div>
        <div id="count" class="rem__count">20</div>
        <button id="napbtn" class="rem__nap" hidden>小睡一会儿</button>
      </div>
    </div>
    <script src="reminder.js"></script>
  </body>
</html>
