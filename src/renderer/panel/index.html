<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>EyeFlow</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/capsule.css" />
    <link rel="stylesheet" href="../shared/app-mark.css" />
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="panel-controls.css" />
  </head>
  <body>
    <main class="panel" id="panel">
      <div class="head">
        <button class="gear" id="gear" aria-label="设置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="3.2" />
            <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" />
          </svg>
        </button>
      </div>

      <div class="hero capsule" id="hero">
        <div class="app-mark"><div class="app-mark__lens"><div class="app-mark__pulse"></div></div></div>
        <div class="hero__body">
          <div class="hero__pct" id="pct">精力 —</div>
          <div class="hero__state" id="state"></div>
        </div>
      </div>

      <div class="today" data-t="today">今天</div>
      <div class="stats">
        <div class="stat"><div class="stat__n" id="eyeuse">—</div><div class="stat__l" data-t="screenTime">今日用眼</div></div>
        <div class="stat__div"></div>
        <div class="stat"><div class="stat__n" id="rests">—</div><div class="stat__l" id="rests-label">歇息</div></div>
      </div>

      <div class="rows">
        <button class="row row--primary" id="act-short">
          <span class="row__ic"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5v14l11-7z" /></svg></span>
          <span class="row__label" data-t="restNow">现在歇一下</span>
          <span class="row__sub" data-t="shortBreakSub">短歇 · 20 秒</span>
          <span class="row__chev"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6" /></svg></span>
        </button>
        <button class="row" id="act-nap">
          <span class="row__ic"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M13.4 3.1a8.2 8.2 0 1 0 7.5 10.6 6.6 6.6 0 0 1-7.5-10.6z" /></svg></span>
          <span class="row__label" data-t="takeNap">小睡一会儿</span>
          <span class="row__sub" id="nap-sub">完整 · 3 分钟</span>
          <span class="row__chev"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6" /></svg></span>
        </button>
      </div>

      <div class="settings" id="settings" hidden>
        <div class="settings__t" data-t="napLength">完整休息时长</div>
        <div class="segs" id="segs"></div>
        <div class="settings__t" data-t="reminderStyle">提醒档位</div>
        <div class="segs" id="tier-segs"></div>
        <div class="settings__t" data-t="language">语言</div>
        <div class="segs" id="lang-segs"></div>
        <div class="settings__t" data-t="launchAtLogin">开机自启</div>
        <div class="segs" id="login-segs"></div>
        <button class="quit" id="quit">
          <span class="quit__ic"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v7" /><path d="M7.4 6.5a7 7 0 1 0 9.2 0" /></svg></span>
          <span data-t="quit">退出</span>
        </button>
        <div class="ver">EyeFlow</div>
      </div>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
