<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>EyeFlow · reminder+</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/capsule.css" />
    <link rel="stylesheet" href="../shared/app-mark.css" />
    <link rel="stylesheet" href="reminder-strong.css" />
    <link rel="stylesheet" href="reminder-strong-controls.css" />
  </head>
  <body>
    <div class="rs-stage">
      <div id="capsule" class="capsule rs">
        <div id="face" class="app-mark"><div class="app-mark__lens"><div class="app-mark__pulse"></div></div></div>
        <div class="rs__body">
          <div id="text" class="rs__text">眼睛歇歇？看看远处。</div>
          <div id="track" class="rs__track"><div id="fill" class="rs__fill"></div></div>
        </div>
        <div id="count" class="rs__count">20</div>
        <button id="napbtn" class="rs__nap" hidden>小睡一会儿</button>
      </div>
    </div>
    <script src="reminder-strong.js"></script>
  </body>
</html>
