<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EyeFlow Next</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <div id="capsule" class="capsule">
        <div id="mira" class="capsule__mira"></div>
        <div class="capsule__body">
          <div id="status" class="capsule__status">精力 —</div>
          <div class="capsule__track"><div id="fill" class="capsule__fill"></div></div>
        </div>
      </div>

      <div class="dev" id="dev">
        <button data-act="ff">快进 1 分钟</button>
        <button data-act="remind">测试一级</button>
        <button data-act="remindNap">测试二级</button>
        <button data-act="shortBreak">短歇 +</button>
        <button data-act="nap">小睡 · 满</button>
        <button data-act="reset">重置</button>
      </div>

      <p id="readout" class="readout">&nbsp;</p>
      <p class="devnote">dev 控件 · 临时；第 6 步将换成真实提醒 / 休息 UI</p>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
