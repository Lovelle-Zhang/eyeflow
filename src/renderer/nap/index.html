<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>EyeFlow · nap</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="../shared/capsule.css" />
    <link rel="stylesheet" href="nap.css" />
  </head>
  <body>
    <div class="nap__fog" aria-hidden="true"></div>
    <main class="nap" id="nap">
      <div id="capsule" class="capsule nap-hero">
        <div id="face" class="mira"><div class="mira__pulse"></div></div>
      </div>
      <div id="clock" class="nap__clock">0:00</div>
      <div class="nap__track"><div id="fill" class="nap__fill"></div></div>
      <p id="message" class="nap__message">闭上眼，缓一缓。</p>
      <p id="hint" class="nap__hint">按 Esc 结束</p>
    </main>
    <script src="nap.js"></script>
  </body>
</html>
