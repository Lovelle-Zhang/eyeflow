<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EyeFlow Rest</title>
  <!-- Load the design system FIRST so this window's inline :root (dark-surface
       --ink etc.) overrides it; otherwise the sheet flips --ink dark and the
       timer/title render dark-on-dark. -->
  <link rel="stylesheet" href="./eyeflow-design-system.css">
  <style>
    :root {
      color-scheme: dark;
      --ink: #e7f1ec;
      --soft: #c9d8d1;
      --muted: rgba(231, 241, 236, 0.58);
      --line: rgba(176, 218, 203, 0.18);
      --mint: #8bd8c1;
      --mint-dim: rgba(139, 216, 193, 0.17);
      --panel: rgba(230, 244, 238, 0.052);
      --bg: #0f1a17;
      --bg-2: #17231e;
      --rest-line: calc(var(--ef-icon-stroke-base) * 1px);
      --mira-ease-organic: cubic-bezier(0.37, 0, 0.2, 1);
      --mira-scale-rest: 2.12;
      --mira-scale-peak: 2.23;
      --mira-breath-lift: -1.2px;
      --mira-body-tilt-rest: 0deg;
      --mira-body-tilt-peak: 0deg;
      --mira-breath-duration: 4.3s;
      --mira-sway-duration: 5.1s;
      --mira-action-blink-duration: 2.1s;
      --mira-blink-duration: 220ms;
      --mira-double-blink-duration: 560ms;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--ef-font-sans);
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(139, 216, 193, 0.055), transparent 38%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
      display: grid;
      place-items: center;
      padding: var(--ef-space-12) var(--ef-space-10);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(760px, 100%);
      display: grid;
      gap: var(--ef-space-8);
      text-align: center;
      min-width: 0;
      align-content: center;
      transform-origin: center;
    }

    /* Fullscreen presence: the calm cluster is fixed-size and read small/lost in
       the void on large displays. Scale the whole block up with the viewport
       (guarded on both axes so it never overflows on small or portrait windows)
       so Mira, the ring and the copy stay proportionate and present. */
    @media (min-height: 880px) and (min-width: 1000px) {
      main { transform: scale(1.18); }
    }
    @media (min-height: 1040px) and (min-width: 1280px) {
      main { transform: scale(1.32); }
    }

    .mira-stage {
      height: 178px;
      display: grid;
      place-items: center;
      position: relative;
      margin-bottom: calc(var(--ef-space-1) * -1);
    }

    .mira-stage::before {
      content: "";
      position: absolute;
      width: 184px;
      height: 184px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(142, 223, 199, 0.1), rgba(142, 223, 199, 0.025) 54%, transparent 72%);
      animation: guidePulse 4.8s var(--ef-ease-calm) infinite;
    }

    .pet {
      width: var(--ef-mira-avatar-size);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(231, 241, 236, 0.9) 0 55%, rgba(190, 222, 210, 0.72) 100%);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      transform: scale(var(--mira-scale-rest));
      transform-origin: center;
      animation: miraAliveBreath var(--mira-breath-duration) var(--mira-ease-organic) infinite;
      transition: transform var(--ef-motion-slow) var(--mira-ease-organic);
      box-shadow:
        inset 0 0 0 1px rgba(231, 241, 236, 0.1),
        inset 0 -8px 18px rgba(15, 159, 122, 0.1),
        0 14px 34px rgba(0, 0, 0, 0.16);
    }

    .pet::before {
      content: "";
      position: absolute;
      top: var(--ef-mira-visor-top);
      left: var(--ef-mira-visor-left);
      width: var(--ef-mira-visor-width);
      height: var(--ef-mira-visor-height);
      border-radius: 999px;
      background: rgba(15, 23, 21, 0.86);
      box-shadow: inset 0 0 0 var(--rest-line) rgba(255, 255, 255, 0.1);
    }

    .pet::after {
      content: "";
      position: absolute;
      right: var(--ef-mira-signal-right);
      top: var(--ef-mira-signal-top);
      width: var(--ef-mira-signal-size);
      height: var(--ef-mira-signal-size);
      border-radius: 999px;
      background: var(--mint);
      box-shadow: 0 0 var(--ef-space-4) rgba(142, 223, 199, 0.38);
      transform-origin: center;
      animation: miraSignalBreath var(--mira-breath-duration) var(--mira-ease-organic) infinite;
      transition:
        transform var(--ef-motion-slow) var(--mira-ease-organic),
        box-shadow var(--ef-motion-slow) var(--mira-ease-organic);
    }

    .pet-face {
      position: absolute;
      top: var(--ef-mira-face-top);
      left: var(--ef-mira-face-left);
      width: var(--ef-mira-face-width);
      height: var(--ef-mira-face-height);
      z-index: 1;
      transition: transform 240ms var(--mira-ease-organic);
    }

    .pet-face::before,
    .pet-face::after {
      content: "";
      position: absolute;
      top: 0;
      width: var(--ef-mira-eye-size);
      height: var(--ef-mira-eye-size);
      border-radius: 50%;
      background: #fbfcf6;
      transform-origin: center;
      transition:
        height 240ms var(--mira-ease-organic),
        transform 240ms var(--mira-ease-organic),
        border-radius 240ms var(--mira-ease-organic);
    }

    .pet-face::before {
      left: 1px;
    }

    .pet-face::after {
      right: 1px;
    }

    .pet-mouth {
      position: absolute;
      top: var(--ef-mira-mouth-top);
      left: 50%;
      width: var(--ef-mira-mouth-width);
      height: var(--ef-mira-mouth-height);
      transform: translateX(-50%);
      border-bottom: var(--ef-mira-mouth-stroke) solid var(--ef-mira-mouth-color);
      border-radius: 0 0 999px 999px;
      z-index: 1;
      transition:
        width 240ms var(--mira-ease-organic),
        height 240ms var(--mira-ease-organic),
        transform 240ms var(--mira-ease-organic),
        border-color 240ms var(--mira-ease-organic),
        background 240ms var(--mira-ease-organic);
    }

    .pet-cheek {
      position: absolute;
      top: var(--ef-mira-cheek-top);
      width: var(--ef-mira-cheek-size);
      height: var(--ef-mira-cheek-height);
      border-radius: 999px;
      background: rgba(215, 79, 117, 0.22);
      z-index: 1;
    }

    .pet-cheek.left {
      left: var(--ef-mira-cheek-offset);
    }

    .pet-cheek.right {
      right: var(--ef-mira-cheek-offset);
    }

    .pet-antenna {
      position: absolute;
      top: var(--ef-mira-antenna-top);
      left: var(--ef-mira-antenna-left);
      width: var(--ef-mira-antenna-width);
      height: var(--ef-mira-antenna-height);
      border-top: var(--ef-mira-antenna-stroke) solid rgba(15, 23, 21, 0.34);
      border-radius: 50%;
      z-index: 0;
      transform-origin: 50% 100%;
      animation: miraAntennaSway var(--mira-sway-duration) var(--mira-ease-organic) infinite;
      transition: transform 240ms var(--mira-ease-organic);
    }

    .mira-caption {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(231, 241, 236, 0.52);
      font-size: var(--ef-text-body-sm);
      font-weight: 720;
      line-height: var(--ef-line-compact);
      white-space: nowrap;
    }

    body[data-relax="gaze"] .pet-face {
      transform: translateX(5px);
    }

    body[data-relax="gaze"] {
      --mira-scale-peak: 2.22;
      --mira-breath-lift: -1px;
      --mira-body-tilt-peak: 0.08deg;
    }

    body[data-relax="blink"] {
      --mira-scale-peak: 2.18;
      --mira-breath-lift: -1.8px;
      --mira-body-tilt-peak: -0.08deg;
    }

    body[data-relax="blink"] .pet {
      background:
        radial-gradient(circle at 50% 50%, rgba(231, 241, 236, 0.9) 0 55%, rgba(190, 222, 210, 0.72) 100%);
    }

    body[data-relax="blink"] .pet-face::before,
    body[data-relax="blink"] .pet-face::after {
      animation: miraActionBlink var(--mira-action-blink-duration) var(--mira-ease-organic) infinite;
    }

    body[data-relax="blink"] .pet-mouth {
      border-bottom-color: var(--ef-mira-mouth-color);
      transform: translateX(-50%) scaleX(0.82);
    }

    body[data-relax="close"] .pet-face::before,
    body[data-relax="close"] .pet-face::after,
    body[data-relax="breath"] .pet-face::before,
    body[data-relax="breath"] .pet-face::after,
    body[data-relax="jaw"] .pet-face::before,
    body[data-relax="jaw"] .pet-face::after,
    body[data-relax="neck"] .pet-face::before,
    body[data-relax="neck"] .pet-face::after {
      height: 2px;
      border-radius: 999px;
      transform: translateY(3px);
      animation: none;
    }

    body[data-relax="close"] {
      --mira-scale-peak: 2.25;
      --mira-breath-lift: -1.1px;
      --mira-body-tilt-peak: 0deg;
    }

    body[data-relax="breath"] {
      --mira-scale-peak: 2.24;
      --mira-breath-lift: -1.4px;
      --mira-body-tilt-peak: 0deg;
    }

    body[data-relax="neck"] {
      --mira-scale-peak: 2.2;
      --mira-breath-lift: -0.9px;
      --mira-body-tilt-peak: 0.45deg;
    }

    body[data-relax="jaw"] {
      --mira-scale-peak: 2.17;
      --mira-breath-lift: -0.7px;
      --mira-body-tilt-peak: -0.16deg;
    }

    body[data-relax="breath"] .pet::after {
      background: #8bd8c1;
      box-shadow: 0 0 var(--ef-space-5) rgba(139, 216, 193, 0.36);
    }

    body[data-relax="breath"] .pet-mouth {
      width: 18px;
      height: 6px;
      border: 0;
      border-radius: 999px;
      background: rgba(142, 223, 199, 0.62);
      transform: translateX(-50%) translateY(1px) scaleX(0.8);
    }

    body[data-relax="neck"] .pet-mouth {
      width: 18px;
      height: 5px;
      border-radius: 999px;
      border: 0;
      background: rgba(142, 223, 199, 0.68);
      transform: translateX(-50%) translateY(1px);
    }

    body[data-relax="jaw"] .pet-mouth {
      width: 18px;
      height: 5px;
      border-radius: 999px;
      border: 0;
      background: rgba(142, 223, 199, 0.68);
      transform: translateX(-50%) translateY(2px) scaleX(0.9);
    }

    body[data-relax="press"] {
      --mira-scale-peak: 2.19;
      --mira-breath-lift: -0.9px;
      --mira-body-tilt-peak: 0.12deg;
    }

    body[data-relax="press"] .pet {
      background:
        radial-gradient(circle at 50% 50%, rgba(244, 232, 205, 0.88) 0 54%, rgba(190, 222, 210, 0.7) 100%);
    }

    body[data-relax="press"] .pet::after {
      background: #e9c979;
      box-shadow: 0 0 var(--ef-space-5) rgba(233, 201, 121, 0.36);
    }

    body[data-relax="press"] .pet-face::before,
    body[data-relax="press"] .pet-face::after {
      height: 2px;
      border-radius: 999px;
      transform: translateY(3px);
      animation: none;
    }

    body[data-relax="press"] .pet-mouth {
      width: 14px;
      height: 6px;
      border: 0;
      border-bottom: var(--rest-line) solid rgba(202, 143, 38, 0.78);
      border-radius: 0 0 999px 999px;
      transform: translateX(-50%) scaleX(0.78);
    }

    body[data-blink="single"] .pet-face::before,
    body[data-blink="single"] .pet-face::after {
      animation: miraRandomBlink var(--mira-blink-duration) var(--mira-ease-organic) 1;
    }

    body[data-blink="double"] .pet-face::before,
    body[data-blink="double"] .pet-face::after {
      animation: miraDoubleBlink var(--mira-double-blink-duration) var(--mira-ease-organic) 1;
    }

    .eyebrow {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto calc(var(--ef-space-1) * -1);
      padding: var(--ef-space-2) var(--ef-space-4);
      border: 1px solid var(--line);
      border-radius: var(--ef-radius-pill);
      color: var(--soft);
      background: rgba(230, 244, 238, 0.045);
      font-size: var(--ef-text-body-sm);
      font-weight: 720;
      line-height: var(--ef-line-compact);
    }

    h1 {
      margin: 0;
      font-size: var(--ef-text-display-sm);
      line-height: var(--ef-line-tight);
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: var(--ef-text-reading);
      line-height: var(--ef-line-reading);
      overflow-wrap: anywhere;
    }

    .task {
      min-width: 0;
      display: grid;
      gap: var(--ef-space-2);
      width: min(640px, 100%);
      margin: 0 auto;
    }

    .task span {
      color: rgba(231, 241, 236, 0.44);
      font-size: var(--ef-text-meta);
      font-weight: 680;
      line-height: var(--ef-line-body);
    }

    .task strong {
      font-size: var(--ef-text-display-sm);
      line-height: var(--ef-line-tight);
      overflow-wrap: anywhere;
    }

    .task p {
      max-width: 540px;
      margin: 0 auto;
    }

    .step-flow {
      width: min(640px, 100%);
      min-width: 0;
      margin: calc(var(--ef-space-1) * -1) auto 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(82px, 1fr));
      gap: var(--ef-space-3);
    }

    .step-flow span {
      min-width: 0;
      min-height: var(--ef-control-md);
      padding: var(--ef-space-2) var(--ef-space-4);
      border-radius: var(--ef-radius-md);
      border: 1px solid rgba(176, 218, 203, 0.14);
      color: rgba(231, 241, 236, 0.48);
      background: rgba(230, 244, 238, 0.04);
      font-size: var(--ef-text-body-sm);
      font-weight: 760;
      line-height: var(--ef-line-compact);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-wrap: anywhere;
      transition:
        color var(--ef-motion-base) var(--ef-ease-calm),
        background var(--ef-motion-base) var(--ef-ease-calm),
        border-color var(--ef-motion-base) var(--ef-ease-calm),
        box-shadow var(--ef-motion-base) var(--ef-ease-calm);
    }

    .step-flow span.done {
      color: rgba(231, 241, 236, 0.62);
      border-color: rgba(142, 223, 199, 0.16);
      background: rgba(142, 223, 199, 0.075);
    }

    .step-flow span.active {
      color: #10201c;
      border-color: rgba(142, 223, 199, 0.42);
      background: rgba(142, 223, 199, 0.72);
      box-shadow: none;
    }

    .ring {
      width: min(28vh, 188px);
      aspect-ratio: 1;
      margin: var(--ef-space-1) auto 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--mint) var(--progress), rgba(230, 244, 238, 0.1) 0);
      box-shadow: inset 0 0 0 1px rgba(231, 241, 236, 0.055);
    }

    .timer-wrap {
      width: calc(min(28vh, 188px) - var(--ef-space-10));
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(15, 26, 23, 0.94);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
    }

    .timer-stack {
      display: grid;
      gap: var(--ef-space-2);
    }

    .timer-label {
      color: rgba(231, 241, 236, 0.42);
      font-size: var(--ef-text-meta);
      font-weight: 680;
      line-height: var(--ef-line-compact);
    }

    .timer {
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      font-size: var(--ef-text-display-md);
      font-weight: 750;
      line-height: var(--ef-line-tight);
    }

    .actions {
      display: grid;
      gap: var(--ef-space-3);
      justify-items: center;
    }

    .done,
    .escape {
      min-height: var(--ef-control-lg);
      padding: 0 var(--ef-space-7);
      border: 1px solid rgba(117, 232, 200, 0.36);
      border-radius: var(--ef-radius-md);
      color: #10201c;
      background: var(--mint);
      font: inherit;
      font-weight: 760;
      cursor: default;
      justify-self: center;
      box-shadow: none;
    }

    .escape {
      min-height: var(--ef-control-md);
      color: rgba(231, 241, 236, 0.54);
      background: rgba(230, 244, 238, 0.032);
      border-color: rgba(231, 241, 236, 0.1);
      font-size: var(--ef-text-body-sm);
      font-weight: 680;
    }

    .escape.armed {
      color: rgba(255, 242, 245, 0.76);
      background: rgba(201, 99, 127, 0.16);
      border-color: rgba(255, 189, 207, 0.24);
    }

    .done:focus,
    .escape:focus {
      outline: none;
    }

    .done:focus-visible,
    .escape:focus-visible {
      box-shadow:
        0 0 0 var(--ef-space-1) rgba(142, 223, 199, 0.2);
    }

    .done[hidden],
    .escape[hidden] {
      display: none;
    }

    .hint {
      color: rgba(231, 241, 236, 0.42);
      font-size: var(--ef-text-body-sm);
      line-height: var(--ef-line-body);
    }

    @keyframes guidePulse {
      0%,
      100% {
        transform: scale(0.96);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    @keyframes miraAliveBreath {
      0%,
      100% {
        transform: scale(var(--mira-scale-rest)) translateY(0) rotate(var(--mira-body-tilt-rest));
      }
      34% {
        transform: scale(var(--mira-scale-peak)) translateY(var(--mira-breath-lift)) rotate(var(--mira-body-tilt-peak));
      }
      46% {
        transform: scale(var(--mira-scale-peak)) translateY(var(--mira-breath-lift)) rotate(var(--mira-body-tilt-peak));
      }
      82% {
        transform: scale(var(--mira-scale-rest)) translateY(0) rotate(var(--mira-body-tilt-rest));
      }
    }

    @keyframes miraActionBlink {
      0%,
      100% {
        height: var(--ef-mira-eye-size);
        border-radius: 50%;
        transform: translateY(0) scaleY(1);
      }
      40%,
      54% {
        height: 2px;
        border-radius: 999px;
        transform: translateY(3px) scaleY(0.9);
      }
      72% {
        height: var(--ef-mira-eye-size);
        border-radius: 50%;
        transform: translateY(0) scaleY(1);
      }
    }

    @keyframes miraRandomBlink {
      0%,
      100% {
        transform: translateY(0) scaleY(1);
      }
      48%,
      62% {
        transform: translateY(1px) scaleY(0.22);
      }
    }

    @keyframes miraDoubleBlink {
      0%,
      100% {
        transform: translateY(0) scaleY(1);
      }
      20%,
      29%,
      62%,
      71% {
        transform: translateY(1px) scaleY(0.22);
      }
      43%,
      84% {
        transform: translateY(0) scaleY(1);
      }
    }

    @keyframes miraAntennaSway {
      0%,
      100% {
        transform: rotate(-0.6deg);
      }
      42%,
      54% {
        transform: rotate(0.6deg);
      }
    }

    @keyframes miraSignalBreath {
      0%,
      100% {
        transform: scale(0.98);
        box-shadow: 0 0 var(--ef-space-4) rgba(142, 223, 199, 0.34);
      }
      38%,
      48% {
        transform: scale(1.04);
        box-shadow: 0 0 var(--ef-space-5) rgba(142, 223, 199, 0.42);
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mira-stage" aria-label="Mira 陪你恢复">
      <div class="pet" aria-hidden="true">
        <div class="pet-antenna"></div>
        <div class="pet-face"></div>
        <div class="pet-cheek left"></div>
        <div class="pet-cheek right"></div>
        <div class="pet-mouth"></div>
      </div>
    </div>
    <div class="task" aria-live="polite">
      <strong id="taskTitle">看向远处</strong>
      <p id="taskCopy">不用盯着屏幕，看远处 20 秒再回来。</p>
    </div>
    <div class="step-flow" id="stepFlow" aria-label="恢复流程"></div>
    <div class="ring" id="ring" style="--progress: 0%;">
      <div class="timer-wrap">
        <div class="timer-stack">
          <span class="timer-label">剩余</span>
          <div class="timer" id="timer">01:30</div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="escape" id="escapeBtn" type="button">紧急退出</button>
      <button class="done" id="doneBtn" type="button" hidden="">回到 EyeFlow</button>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const els = {
      taskTitle: document.querySelector("#taskTitle"),
      taskCopy: document.querySelector("#taskCopy"),
      timer: document.querySelector("#timer"),
      ring: document.querySelector("#ring"),
      doneBtn: document.querySelector("#doneBtn"),
      escapeBtn: document.querySelector("#escapeBtn"),
      stepFlow: document.querySelector("#stepFlow"),
      pet: document.querySelector(".pet")
    };
    let totalSeconds = 90;
    let endsAt = Date.now() + totalSeconds * 1000;
    let ticker = null;
    let previewSession = false;
    let voiceGuide = true;
    let spokenTaskIndex = -1;
    let completionSpoken = false;
    let completionShown = false;
    let escapeArmedUntil = 0;
    let currentTaskIndex = -1;
    let currentRelaxMood = "neutral";
    let relaxTransitionTimer = null;
    let nextBreathShiftAt = 0;
    let nextBlinkAt = 0;
    let blinkClearAt = 0;
    const breathBaseSeconds = {
      neutral: 4.3,
      gaze: 4.2,
      blink: 2.4,
      breath: 4.8,
      close: 5.4,
      neck: 4.6,
      jaw: 3.8,
      press: 3.6
    };
    const defaultTasks = [
      {
        mood: "gaze",
        label: "远眺",
        title: "看向远处",
        copy: "不用盯着屏幕，看远处 20 秒再回来。",
        caption: "看远处",
        voiceCue: "不用盯着屏幕。看向远处，20 秒后再慢慢回来。"
      },
      {
        mood: "blink",
        label: "慢眨眼",
        title: "跟 Mira 慢慢眨眼",
        copy: "跟着 Mira 的节奏眨 8 次，每一次都闭完整一点。",
        caption: "慢慢眨，不要急",
        voiceCue: "慢慢眨眼。每一次都闭完整一点，再自然睁开。"
      },
      {
        mood: "breath",
        label: "慢呼吸",
        title: "跟 Mira 慢慢呼吸",
        copy: "吸气时肩膀不要抬，呼气时让眼眶周围松一点。",
        caption: "呼气时放松",
        voiceCue: "吸气不用用力。呼气时，让眼眶周围松下来。"
      },
      {
        mood: "close",
        label: "闭眼",
        title: "和 Mira 一起闭眼",
        copy: "闭眼 10 秒，把眉心、下巴和屏幕里的紧张一起放下来。",
        caption: "眼睛先休息",
        voiceCue: "现在闭眼。眉心放松，下巴也松一点。"
      },
      {
        mood: "neck",
        label: "肩颈",
        title: "跟 Mira 放松肩颈",
        copy: "下巴微收，肩膀慢慢沉下去。等提示出现后再回来。",
        caption: "肩膀慢慢沉下去",
        voiceCue: "下巴微收。肩膀慢慢沉下去，后颈变长一点。"
      },
      {
        mood: "jaw",
        label: "下颌",
        title: "把下颌松开一点",
        copy: "牙齿轻轻分开，舌尖自然放松，别让脸部继续用力。",
        caption: "脸也放松",
        voiceCue: "牙齿轻轻分开。舌尖放松，让脸也休息一下。"
      }
    ];
    let activeTasks = defaultTasks;

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function normalizeBreakTasks(input) {
      let tasks = input;
      if (typeof tasks === "string" && tasks.trim()) {
        try {
          tasks = JSON.parse(tasks);
        } catch (_error) {
          tasks = null;
        }
      }
      if (!Array.isArray(tasks) || tasks.length === 0) return defaultTasks;
      const allowedMoods = new Set(["gaze", "blink", "close", "neck", "jaw", "press", "breath"]);
      const safeTasks = tasks.slice(0, 6).map((task) => ({
        mood: allowedMoods.has(task?.mood) ? task.mood : "gaze",
        label: String(task?.label || "").slice(0, 12),
        title: String(task?.title || "").slice(0, 48),
        copy: String(task?.copy || "").slice(0, 140),
        caption: String(task?.caption || "").slice(0, 36),
        voiceCue: String(task?.voiceCue || "").slice(0, 120)
      })).filter((task) => task.title && task.copy);
      return safeTasks.length ? safeTasks : defaultTasks;
    }

    function stepLabel(task) {
      return String(task?.label || task?.caption || task?.title || "恢复").slice(0, 8);
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function randomizedSeconds(base, jitter) {
      return base * randomBetween(1 - jitter, 1 + jitter);
    }

    function setBreathCycle(mood = currentRelaxMood) {
      const base = breathBaseSeconds[mood] || breathBaseSeconds.neutral;
      const duration = randomizedSeconds(base, 0.17);
      document.body.style.setProperty("--mira-breath-duration", `${duration.toFixed(2)}s`);
      document.body.style.setProperty("--mira-sway-duration", `${(duration * randomBetween(1.08, 1.22)).toFixed(2)}s`);
      document.body.style.setProperty("--mira-action-blink-duration", `${randomizedSeconds(2.1, 0.22).toFixed(2)}s`);
      nextBreathShiftAt = Date.now() + duration * 1000;
    }

    function clearBlink() {
      document.body.removeAttribute("data-blink");
      blinkClearAt = 0;
    }

    function scheduleBlink(now = Date.now()) {
      nextBlinkAt = now + randomBetween(2000, 6000);
    }

    function triggerBlink(now = Date.now()) {
      const doubleBlink = Math.random() < 0.18;
      document.body.style.setProperty("--mira-blink-duration", `${Math.round(randomBetween(170, 260))}ms`);
      document.body.style.setProperty("--mira-double-blink-duration", `${Math.round(randomBetween(470, 650))}ms`);
      document.body.dataset.blink = doubleBlink ? "double" : "single";
      blinkClearAt = now + (doubleBlink ? 720 : 330);
      scheduleBlink(now);
    }

    function canIdleBlink() {
      return !document.hidden && !["blink", "close", "breath", "neck", "jaw", "press"].includes(currentRelaxMood);
    }

    function driveMotionTick(now = Date.now()) {
      if (now >= nextBreathShiftAt) setBreathCycle(currentRelaxMood);
      if (blinkClearAt && now >= blinkClearAt) clearBlink();
      if (!nextBlinkAt) scheduleBlink(now);
      if (now >= nextBlinkAt) {
        if (canIdleBlink()) {
          triggerBlink(now);
          return;
        }
        scheduleBlink(now);
      }
    }

    function setRelaxMood(nextMood, options = {}) {
      const safeMood = nextMood || "neutral";
      if (safeMood === currentRelaxMood && document.body.dataset.relax === safeMood) return;
      currentRelaxMood = safeMood;
      setBreathCycle(safeMood);
      clearBlink();
      window.clearTimeout(relaxTransitionTimer);
      if (options.immediate) {
        document.body.dataset.relax = safeMood;
        document.body.removeAttribute("data-relax-transition");
        return;
      }
      document.body.dataset.relaxTransition = "true";
      document.body.dataset.relax = "neutral";
      relaxTransitionTimer = window.setTimeout(() => {
        document.body.dataset.relax = safeMood;
        relaxTransitionTimer = window.setTimeout(() => {
          document.body.removeAttribute("data-relax-transition");
        }, 260);
      }, 90);
    }

    function renderStepFlow(activeIndex) {
      const fragment = document.createDocumentFragment();
      activeTasks.forEach((task, index) => {
        const step = document.createElement("span");
        step.textContent = stepLabel(task);
        step.classList.toggle("done", index < activeIndex);
        step.classList.toggle("active", index === activeIndex);
        fragment.append(step);
      });
      els.stepFlow.replaceChildren(fragment);
    }

    function canUseSpeechSynthesis() {
      return "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
    }

    function speakFallback(text) {
      if (!canUseSpeechSynthesis()) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-CN";
      utterance.rate = 0.86;
      utterance.pitch = 1;
      utterance.volume = 0.82;
      const voices = window.speechSynthesis.getVoices?.() || [];
      const voice = voices.find((item) => /^zh/i.test(item.lang) || /Chinese|Mandarin|Ting|Mei/i.test(item.name));
      if (voice) utterance.voice = voice;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function stopVoiceGuide() {
      window.eyeflowDesktop?.stopVoice?.();
      if (canUseSpeechSynthesis()) window.speechSynthesis.cancel();
    }

    function resetEscapeButton() {
      escapeArmedUntil = 0;
      els.escapeBtn.classList.remove("armed");
      els.escapeBtn.textContent = "紧急退出";
    }

    function speakVoiceGuide(text) {
      if (!voiceGuide) return;
      const safeText = String(text || "").replace(/\s+/g, " ").trim().slice(0, 520);
      if (!safeText) return;
      if (window.eyeflowDesktop?.speak) {
        window.eyeflowDesktop.speak({ text: safeText })
          .then((result) => {
            if (!result?.ok) speakFallback(safeText);
          })
          .catch(() => speakFallback(safeText));
        return;
      }
      speakFallback(safeText);
    }

    function voiceTextForTask(task, index) {
      const prefix = index === 0
        ? "现在可以不用看屏幕了，我会用声音带你完成。第一步，"
        : `第 ${index + 1} 步，`;
      const cue = task.voiceCue || task.copy;
      return `${prefix}${task.label || task.title}。${cue}`;
    }

    function maybeSpeakTask(task, index) {
      if (!voiceGuide || index === spokenTaskIndex) return;
      spokenTaskIndex = index;
      speakVoiceGuide(voiceTextForTask(task, index));
    }

    function maybeSpeakCompletion() {
      if (!voiceGuide || completionSpoken) return;
      completionSpoken = true;
      speakVoiceGuide("好了，可以慢慢回来了。回到 EyeFlow 的按钮已经出现。");
    }

    function applyPayload(payload = {}) {
      previewSession = payload.preview === true || payload.preview === "1";
      const minSeconds = previewSession ? 4 : 15;
      totalSeconds = Math.max(minSeconds, Math.min(600, Number(payload.seconds) || totalSeconds));
      endsAt = Date.now() + totalSeconds * 1000;
      voiceGuide = payload.voiceGuide !== false && payload.voiceGuide !== "0";
      spokenTaskIndex = -1;
      completionSpoken = false;
      completionShown = false;
      stopVoiceGuide();
      activeTasks = normalizeBreakTasks(payload.tasks || params.get("tasks"));
      currentTaskIndex = -1;
      currentRelaxMood = "neutral";
      setBreathCycle(currentRelaxMood);
      scheduleBlink();
      document.body.removeAttribute("data-complete");
      els.doneBtn.hidden = true;
      els.escapeBtn.hidden = false;
      resetEscapeButton();
      if (!ticker) ticker = window.setInterval(tick, 250);
      tick();
    }

    function showCompletion() {
      if (completionShown) return;
      completionShown = true;
      document.body.dataset.complete = "true";
      setRelaxMood("close");
      els.taskTitle.textContent = "可以慢慢回来了";
      els.taskCopy.textContent = previewSession
        ? "恢复流程预览结束，可以回到 EyeFlow。"
        : "这轮恢复完成。慢慢把视线收回来，再回到 EyeFlow。";
      renderStepFlow(activeTasks.length);
      els.timer.textContent = "00:00";
      els.ring.style.setProperty("--progress", "100%");
      resetEscapeButton();
      els.escapeBtn.hidden = true;
      els.doneBtn.hidden = false;
      window.setTimeout(() => els.doneBtn.focus({ preventScroll: true }), 80);
      maybeSpeakCompletion();
    }

    function tick() {
      const now = Date.now();
      driveMotionTick(now);
      const remaining = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      const progress = totalSeconds <= 0 ? 100 : ((totalSeconds - remaining) / totalSeconds) * 100;
      const taskIndex = Math.min(activeTasks.length - 1, Math.floor(progress / (100 / activeTasks.length)));
      const task = activeTasks[taskIndex];
      els.taskTitle.textContent = task.title;
      els.taskCopy.textContent = task.copy;
      renderStepFlow(taskIndex);
      if (taskIndex !== currentTaskIndex) {
        currentTaskIndex = taskIndex;
        setRelaxMood(task.mood, { immediate: taskIndex === 0 });
      }
      maybeSpeakTask(task, taskIndex);
      els.timer.textContent = formatTime(remaining);
      els.ring.style.setProperty("--progress", `${Math.max(0, Math.min(100, progress))}%`);
      if (remaining <= 0) {
        window.clearInterval(ticker);
        ticker = null;
        showCompletion();
      }
    }

    els.doneBtn.addEventListener("click", () => {
      stopVoiceGuide();
      window.eyeflowDesktop?.finishForceBreak?.({
        preview: previewSession,
        feedback: "better",
        completedAt: new Date().toISOString()
      });
    });

    els.escapeBtn.addEventListener("click", () => {
      const now = Date.now();
      if (escapeArmedUntil < now) {
        escapeArmedUntil = now + 3500;
        els.escapeBtn.classList.add("armed");
        els.escapeBtn.textContent = "再点一次确认退出";
        window.setTimeout(() => {
          if (escapeArmedUntil > Date.now()) return;
          resetEscapeButton();
        }, 3600);
        return;
      }
      stopVoiceGuide();
      window.eyeflowDesktop?.finishForceBreak?.({
        preview: previewSession,
        interrupted: true,
        completedAt: new Date().toISOString()
      });
    });

    window.eyeflowDesktop?.onForceBreakUpdate?.(applyPayload);
    applyPayload({
      seconds: params.get("seconds"),
      title: params.get("title"),
      copy: params.get("copy"),
      tasks: params.get("tasks"),
      preview: params.get("preview"),
      voiceGuide: params.get("voiceGuide")
    });
  </script>
</body>
</html>
