<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mira Panel</title>
  <style>
    :root {
      --ink: #1b2622;
      --muted: #64736b;
      --line: #d8e2d6;
      --popover-bg: rgba(25, 31, 34, 0.82);
      --popover-line: rgba(255, 255, 255, 0.075);
      --popover-shadow:
        0 10px 24px rgba(10, 18, 20, 0.16),
        0 1px 2px rgba(10, 18, 20, 0.12);
      --popover-text: rgba(247, 252, 249, 0.94);
      --popover-muted: rgba(231, 242, 238, 0.68);
      --popover-context: rgba(231, 242, 238, 0.46);
      --popover-button-hover: rgba(255, 255, 255, 0.075);
      --popover-focus: rgba(128, 215, 189, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      border: 0;
      font: inherit;
      cursor: default;
    }

    .panel {
      width: 100%;
      height: 100%;
      position: relative;
      color: var(--popover-text);
    }

    .panel::before {
      content: "";
      position: absolute;
      left: var(--ef-space-4);
      top: 43px;
      width: var(--ef-space-6);
      height: var(--ef-space-6);
      border-radius: var(--ef-radius-xs);
      background: var(--popover-bg);
      transform: rotate(45deg);
      box-shadow: -1px 1px 0 var(--popover-line);
      z-index: 0;
    }

    .panel.theme-day {
      --popover-bg: rgba(251, 252, 246, 0.94);
      --popover-line: rgba(24, 32, 31, 0.065);
      --popover-shadow:
        0 10px 24px rgba(30, 44, 38, 0.09),
        0 1px 2px rgba(30, 44, 38, 0.06);
      --popover-text: var(--ink);
      --popover-muted: rgba(100, 115, 107, 0.76);
      --popover-context: rgba(100, 115, 107, 0.58);
      --popover-button-hover: rgba(24, 32, 31, 0.055);
      --popover-focus: rgba(15, 159, 122, 0.34);
    }

    .bubble {
      position: absolute;
      inset: var(--ef-space-2) 0 var(--ef-space-2) var(--ef-space-6);
      z-index: 1;
      overflow: hidden;
      padding: var(--ef-space-6) var(--ef-space-5) var(--ef-space-6) var(--ef-space-7);
      border: 1px solid var(--popover-line);
      border-radius: var(--ef-radius-lg);
      background: var(--popover-bg);
      box-shadow: var(--popover-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--ef-space-3);
      align-items: start;
      align-content: center;
    }

    .bubble > div:first-child {
      min-width: 0;
      display: grid;
      gap: var(--ef-space-2);
    }

    .panel.anchor-top::before {
      top: 21px;
    }

    .panel.anchor-bottom::before {
      top: auto;
      bottom: 21px;
    }

    .panel.side-left .bubble {
      inset: var(--ef-space-2) var(--ef-space-6) var(--ef-space-2) 0;
    }

    .panel.side-left::before {
      right: var(--ef-space-4);
      left: auto;
      box-shadow: 1px -1px 0 var(--popover-line);
    }

    strong {
      display: block;
      margin: 0;
      color: var(--popover-text);
      font-size: var(--ef-text-body-sm);
      line-height: var(--ef-line-title);
      font-weight: 680;
      overflow-wrap: anywhere;
    }

    p {
      margin: 0;
      max-width: 100%;
      color: var(--popover-muted);
      font-size: var(--ef-text-helper);
      line-height: var(--ef-line-body);
      overflow-wrap: anywhere;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .context-line {
      display: block;
      color: var(--popover-context);
      font-size: var(--ef-text-caption);
      line-height: var(--ef-line-compact);
      font-weight: var(--ef-symbol-weight-quiet);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: var(--ef-space-2);
      padding-top: var(--ef-space-1);
    }

    .icon-btn {
      width: var(--ef-hit-target);
      height: var(--ef-hit-target);
      border-radius: var(--ef-radius-md);
      background: transparent;
      border: 1px solid transparent;
      color: var(--popover-context);
      display: grid;
      place-items: center;
      opacity: 0.86;
      transition:
        background var(--ef-motion-fast) var(--ef-ease-calm),
        color var(--ef-motion-fast) var(--ef-ease-calm),
        opacity var(--ef-motion-fast) var(--ef-ease-calm);
    }

    .icon-btn + .icon-btn {
      opacity: 0.62;
    }

    .icon-btn:hover {
      background: var(--popover-button-hover);
      color: var(--popover-text);
      opacity: 0.9;
    }

    .icon-btn:focus {
      outline: none;
    }

    .icon-btn:focus-visible {
      outline: 1px solid var(--popover-focus);
      outline-offset: 2px;
    }

    svg {
      width: var(--ef-icon-sm);
      height: var(--ef-icon-sm);
      stroke-width: var(--ef-icon-stroke-quiet);
    }
  </style>
  <link rel="stylesheet" href="./eyeflow-design-system.css">
</head>
<body>
  <aside class="panel" id="panel">
    <div class="bubble">
      <div>
        <strong id="title">Mira 在这里</strong>
        <p id="message">我会轻轻看着节奏，先轻提醒陪伴。</p>
        <span class="context-line" id="contextLine">舒适区 · L1 安静</span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="openBtn" type="button" title="打开手动专注">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </button>
        <button class="icon-btn" id="collapseBtn" type="button" title="收起 Mira">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <script>
    const panel = document.querySelector("#panel");
    const title = document.querySelector("#title");
    const message = document.querySelector("#message");
    const contextLine = document.querySelector("#contextLine");

    function getTheme() {
      const hour = new Date().getHours();
      return hour >= 7 && hour < 19 ? "day" : "night";
    }

    function refreshTheme() {
      const theme = getTheme();
      panel.classList.toggle("theme-day", theme === "day");
      panel.classList.toggle("theme-night", theme === "night");
    }

    refreshTheme();
    window.setInterval(refreshTheme, 60 * 1000);

    function setPanelHovering(hovering) {
      window.eyeflowDesktop?.setCompanionHover?.("panel", hovering);
    }

    function releaseMouseFocus(event) {
      if (event.detail > 0) event.currentTarget.blur();
    }

    if (window.eyeflowDesktop?.onState) {
      window.eyeflowDesktop.onState((state) => {
        title.textContent = state.title || "Mira 在这里";
        const mood = state.mood === "calm" ? "" : state.mood || "";
        message.textContent = mood === "rest"
          ? `${state.message || "找一个恢复断点，看远处 20 秒。"} 点 Mira 打开休息指引。`
          : state.message || "我会轻轻看着节奏，先轻提醒陪伴。";
        contextLine.textContent = state.continuityLine || `${state.loadZone || "舒适区"} · ${state.intensityLabel || "L1 安静"}`;
      });
    }

    if (window.eyeflowDesktop?.onPanelSide) {
      window.eyeflowDesktop.onPanelSide((payload) => {
        const side = typeof payload === "string" ? payload : payload?.side;
        const anchorY = typeof payload === "object" ? payload.anchorY : "center";
        panel.classList.toggle("side-left", side === "left");
        panel.classList.toggle("side-right", side !== "left");
        panel.classList.toggle("anchor-top", anchorY === "top");
        panel.classList.toggle("anchor-bottom", anchorY === "bottom");
      });
    }

    document.querySelector("#openBtn").addEventListener("click", (event) => {
      releaseMouseFocus(event);
      window.eyeflowDesktop?.showDashboard({ view: "todayView", focus: "manualStart" });
    });

    document.querySelector("#collapseBtn").addEventListener("click", (event) => {
      releaseMouseFocus(event);
      setPanelHovering(false);
      window.eyeflowDesktop?.setCompanionExpanded(false);
    });

    panel.addEventListener("mouseenter", () => setPanelHovering(true));
    panel.addEventListener("mouseleave", () => setPanelHovering(false));
    window.addEventListener("blur", () => setPanelHovering(false));
  </script>
</body>
</html>
