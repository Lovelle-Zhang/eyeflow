<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mira</title>
  <style>
    :root {
      --ink: #1b2622;
      --muted: #64736b;
      --line: #d8e2d6;
      --mint: #2a927a;
      --mint-soft: #dcefe5;
      --blue-soft: #e5edf1;
      --amber-soft: #f5ead3;
      --rose-soft: #f7dde5;
      --mira-mouth: rgba(126, 244, 216, 0.54);
      /* Eye fill — dimmed in night so the eyes don't glare on the dark face. */
      --mira-eye-fill: #fbfcf6;
      --mira-antenna: rgba(15, 23, 21, 0.32);
      --mira-antenna-glow: rgba(107, 224, 203, 0.14);
      --mira-signal: #80d7bd;
      --mira-signal-glow: rgba(128, 215, 189, 0.42);
      --mira-line: calc(var(--ef-icon-stroke-base) * 1px);
      --popover-bg: rgba(30, 36, 41, 0.96);
      --popover-line: rgba(255, 255, 255, 0.07);
      --popover-shadow:
        0 12px 30px rgba(0, 0, 0, 0.42),
        0 1px 3px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      --popover-text: rgba(247, 252, 250, 0.96);
      --popover-muted: rgba(224, 236, 231, 0.72);
      --popover-context: rgba(206, 222, 216, 0.52);
      --popover-button-hover: rgba(255, 255, 255, 0.08);
      --popover-focus: rgba(128, 215, 189, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      border: 0;
      font: inherit;
      cursor: default;
    }

    .shell {
      width: 100%;
      height: 100%;
      padding: var(--ef-space-3);
      display: grid;
      place-items: center;
    }

    .companion {
      width: 70px;
      height: 70px;
      display: block;
      border-radius: 22px;
      background: transparent;
      position: relative;
      -webkit-app-region: no-drag;
      transition:
        background var(--ef-motion-fast) var(--ef-ease-calm),
        box-shadow var(--ef-motion-fast) var(--ef-ease-calm);
    }

    .companion.booting {
      opacity: 0;
      transform: translateY(0) scale(0.98);
    }

    .companion.ready {
      opacity: 1;
      transition: opacity 160ms ease;
    }

    .companion.speaking {
      width: calc(100vw - var(--ef-space-6));
      height: calc(var(--ef-mira-avatar-size) + var(--ef-space-8));
    }

    .companion::after {
      display: none;
    }

    .companion.expanded {
      width: calc(100vw - 16px);
      height: calc(100vh - 16px);
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    .companion.expanded::after {
      display: none;
    }

    .companion.theme-day.expanded {
      background: transparent;
      box-shadow: none;
    }

    .companion.theme-day {
      --popover-bg: rgba(252, 252, 250, 0.97);
      --popover-line: rgba(20, 28, 26, 0.07);
      --popover-shadow:
        0 8px 26px rgba(26, 38, 34, 0.16),
        0 1px 3px rgba(26, 38, 34, 0.09),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      --popover-text: var(--ink);
      --popover-muted: rgba(48, 60, 55, 0.74);
      --popover-context: rgba(86, 99, 92, 0.66);
      --popover-button-hover: rgba(20, 28, 26, 0.05);
      --popover-focus: rgba(15, 159, 122, 0.34);
    }

    .pet {
      width: var(--ef-mira-avatar-size);
      aspect-ratio: 1;
      position: absolute;
      left: 6px;
      top: 6px;
      border-radius: var(--ef-mira-avatar-radius);
      background:
        linear-gradient(150deg, #172c2e 0%, #1f3937 48%, #142224 100%);
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow:
        inset 0 0 0 1px rgba(127, 241, 213, 0.07),
        inset 0 -10px 20px rgba(3, 10, 12, 0.22);
      cursor: pointer;
      -webkit-app-region: no-drag;
      animation: idleFloat 4.8s ease-in-out infinite;
      transition:
        transform var(--ef-motion-base) var(--ef-ease-calm),
        box-shadow var(--ef-motion-base) var(--ef-ease-calm),
        background var(--ef-motion-slow) var(--ef-ease-calm);
    }

    .companion.settling .pet,
    .companion.settling .pet:hover,
    .companion.settling .pet:active {
      animation: none;
      transform: translateY(0) scale(1);
      transition: none;
    }

    .companion.expanded .pet {
      left: auto;
      right: 6px;
      top: calc(50% - (var(--ef-mira-avatar-size) / 2));
      z-index: 2;
    }

    .companion.speaking .pet {
      left: auto;
      right: var(--ef-space-5);
      top: calc(50% - (var(--ef-mira-avatar-size) / 2));
      z-index: 2;
    }

    .companion.settling .pet::after,
    .companion.settling .face::before,
    .companion.settling .face::after {
      animation: none;
    }

    .theme-day .pet {
      background:
        linear-gradient(150deg, #fbfcf6 0%, #edf6ef 50%, #e5edf1 100%);
      box-shadow:
        inset 0 0 0 1px rgba(24, 32, 31, 0.06),
        inset 0 -8px 18px rgba(15, 159, 122, 0.08);
    }

    .pet:hover {
      transform: translateY(-1px);
    }

    .pet:active {
      transform: translateY(0) scale(0.97);
    }

    .companion.dragging .pet,
    .companion.dragging .pet:active {
      cursor: grabbing;
    }

    .pet::before {
      content: "";
      position: absolute;
      top: var(--ef-mira-visor-top);
      left: var(--ef-mira-visor-left);
      width: var(--ef-mira-visor-width);
      height: var(--ef-mira-visor-height);
      border-radius: 999px;
      background:
        linear-gradient(90deg, rgba(129, 239, 216, 0.18), rgba(108, 176, 255, 0.12)),
        rgba(6, 13, 15, 0.92);
      box-shadow:
        inset 0 0 0 1px rgba(139, 246, 222, 0.12);
    }

    .theme-day .pet::before {
      background:
        linear-gradient(90deg, rgba(127, 232, 207, 0.22), rgba(104, 166, 232, 0.16)),
        rgba(20, 34, 36, 0.88);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .pet::after {
      content: "";
      position: absolute;
      top: var(--ef-mira-signal-top);
      right: var(--ef-mira-signal-right);
      width: var(--ef-mira-signal-size);
      height: var(--ef-mira-signal-size);
      border-radius: 50%;
      background: var(--mira-signal);
      box-shadow: 0 0 var(--ef-space-3) var(--mira-signal-glow);
      animation: signalPulse 2.8s ease-in-out infinite;
    }

    .focus {
      --mira-signal: #7cc6dd;
      --mira-signal-glow: rgba(124, 198, 221, 0.4);
    }

    .blink {
      --mira-signal: #e9c979;
      --mira-signal-glow: rgba(233, 201, 121, 0.34);
    }

    .rest {
      --mira-signal: #e78da8;
      --mira-signal-glow: rgba(231, 141, 168, 0.42);
    }

    .face {
      position: absolute;
      top: var(--ef-mira-face-top);
      left: var(--ef-mira-face-left);
      width: var(--ef-mira-face-width);
      height: var(--ef-mira-face-height);
      z-index: 1;
    }

    .face::before,
    .face::after {
      content: "";
      position: absolute;
      top: 0;
      width: var(--ef-mira-eye-size);
      height: var(--ef-mira-eye-size);
      border-radius: 50%;
      background: var(--mira-eye-fill);
      animation: blink 5s ease-in-out infinite;
    }

    .companion.theme-night {
      --mira-eye-fill: #cdd6d1;
    }

    .face::before {
      left: 1px;
    }

    .face::after {
      right: 1px;
    }

    .mouth {
      position: absolute;
      top: var(--ef-mira-mouth-top);
      left: 50%;
      width: var(--ef-mira-mouth-width);
      height: var(--ef-mira-mouth-height);
      transform: translateX(-50%);
      border-bottom: var(--ef-mira-mouth-stroke) solid var(--mira-mouth);
      border-radius: 0 0 999px 999px;
      z-index: 1;
    }

    .antenna {
      position: absolute;
      top: var(--ef-mira-antenna-top);
      left: var(--ef-mira-antenna-left);
      width: var(--ef-mira-antenna-width);
      height: var(--ef-mira-antenna-height);
      border-top: var(--ef-mira-antenna-stroke) solid var(--mira-antenna);
      filter: drop-shadow(0 0 var(--ef-space-1) var(--mira-antenna-glow));
      border-radius: 50%;
    }

    .cheek {
      position: absolute;
      top: var(--ef-mira-cheek-top);
      width: var(--ef-mira-cheek-size);
      height: var(--ef-mira-cheek-height);
      border-radius: 999px;
      background: rgba(255, 139, 176, 0.24);
      z-index: 1;
    }

    .cheek.left {
      left: var(--ef-mira-cheek-offset);
    }

    .cheek.right {
      right: var(--ef-mira-cheek-offset);
    }

    .body {
      display: none;
      position: absolute;
      left: 86px;
      top: 7px;
      min-width: 0;
      cursor: default;
    }

    .companion.expanded .body {
      display: grid;
      align-content: center;
      gap: var(--ef-space-2);
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      max-width: none;
      padding: var(--ef-space-5) calc(var(--ef-mira-avatar-size) + var(--ef-space-6)) var(--ef-space-5) var(--ef-space-7);
      border: 0.5px solid var(--popover-line);
      border-radius: var(--ef-radius-xl);
      background: var(--popover-bg);
      box-shadow: var(--popover-shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--popover-text);
      cursor: pointer;
    }

    .companion.expanded .body strong {
      margin: 0;
    }

    .companion.expanded .context-line {
      margin-top: 0;
      padding-left: 12px;
      position: relative;
    }

    .companion.expanded .context-line::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--mira-signal);
    }

    .mira-bubble {
      position: absolute;
      inset: 0;
      padding: var(--ef-space-5) calc(var(--ef-mira-avatar-size) + var(--ef-space-8) + var(--ef-space-5)) var(--ef-space-5) var(--ef-space-6);
      border-radius: var(--ef-radius-xl);
      border: 0.5px solid var(--popover-line);
      background: var(--popover-bg);
      color: var(--popover-text);
      box-shadow: var(--popover-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: grid;
      align-content: center;
      opacity: 0;
      transform: translateY(var(--ef-space-2)) scale(0.985);
      pointer-events: none;
      transition:
        opacity var(--ef-motion-base) var(--ef-ease-calm),
        transform var(--ef-motion-base) var(--ef-ease-calm);
    }

    .mira-bubble::after {
      display: none;
    }

    .companion.speaking .mira-bubble {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    .mira-bubble span {
      position: relative;
      z-index: 1;
      font-size: var(--ef-text-body-sm);
      line-height: var(--ef-line-body);
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    strong {
      display: block;
      margin: 0 0 var(--ef-space-2);
      color: var(--popover-text);
      font-size: var(--ef-text-body-sm);
      line-height: var(--ef-line-title);
      font-weight: 680;
      overflow-wrap: anywhere;
    }

    p {
      margin: 0;
      color: var(--popover-muted);
      font-size: var(--ef-text-helper);
      line-height: var(--ef-line-body);
      overflow-wrap: anywhere;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .context-line {
      display: block;
      margin-top: var(--ef-space-2);
      color: var(--popover-context);
      font-size: var(--ef-text-caption);
      line-height: var(--ef-line-compact);
      font-weight: var(--ef-symbol-weight-quiet);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: none;
      position: absolute;
      top: var(--ef-space-4);
      right: calc(var(--ef-mira-avatar-size) + var(--ef-space-5));
    }

    .companion.expanded .actions {
      display: flex;
      flex-direction: row;
      gap: var(--ef-space-1);
      z-index: 2;
    }

    .companion.expanded .icon-btn {
      width: 26px;
      height: 26px;
      border-radius: var(--ef-radius-sm);
    }

    .icon-btn {
      width: var(--ef-hit-target);
      height: var(--ef-hit-target);
      border-radius: var(--ef-radius-md);
      background: transparent;
      border: 1px solid transparent;
      color: var(--popover-context);
      display: grid;
      place-items: center;
      opacity: 0.86;
      transition:
        background var(--ef-motion-fast) var(--ef-ease-calm),
        color var(--ef-motion-fast) var(--ef-ease-calm),
        opacity var(--ef-motion-fast) var(--ef-ease-calm);
    }

    .icon-btn + .icon-btn {
      opacity: 0.62;
    }

    .icon-btn:hover {
      background: var(--popover-button-hover);
      color: var(--popover-text);
      opacity: 0.9;
    }

    .icon-btn:focus {
      outline: none;
    }

    .icon-btn:focus-visible {
      outline: 1px solid var(--popover-focus);
      outline-offset: 2px;
    }

    .icon-btn svg {
      width: var(--ef-icon-sm);
      height: var(--ef-icon-sm);
      stroke-width: var(--ef-icon-stroke-quiet);
    }

    .focus .pet {
      background:
        linear-gradient(150deg, #132b33 0%, #1d3d48 48%, #142329 100%);
      animation: focusBreathe 5.2s ease-in-out infinite;
    }

    .theme-day.focus .pet {
      background:
        linear-gradient(150deg, #fbfcf6 0%, #e5edf1 50%, #dcefe5 100%);
    }

    .blink .pet {
      background:
        linear-gradient(150deg, #202c27 0%, #303727 48%, #142421 100%);
      animation: blinkCue 2.2s ease-in-out infinite;
    }

    .theme-day.blink .pet {
      background:
        linear-gradient(150deg, #fbfcf6 0%, #f5ead3 50%, #dcefe5 100%);
    }

    .blink .face::before,
    .blink .face::after {
      height: 2px;
      border-radius: 999px;
      transform: translateY(2px);
      animation-duration: 2.2s;
    }

    .blink .mouth {
      width: var(--ef-mira-mouth-width);
      height: var(--ef-mira-mouth-height);
      top: var(--ef-mira-mouth-top);
      border: 0;
      border-bottom: var(--ef-mira-mouth-stroke) solid rgba(255, 214, 111, 0.66);
      border-radius: 0 0 999px 999px;
      transform: translateX(-50%) scaleX(0.82);
      box-shadow: 0 0 var(--ef-space-2) rgba(255, 214, 111, 0.12);
    }

    .theme-day.blink .mouth {
      border-bottom-color: rgba(202, 143, 38, 0.62);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .rest .pet {
      background:
        linear-gradient(150deg, #311f27 0%, #442735 48%, #2a2223 100%);
      animation: nudge 1.8s ease-in-out infinite;
    }

    .theme-day.rest .pet {
      background:
        linear-gradient(150deg, #fbfcf6 0%, #f7dde5 52%, #f5ead3 100%);
    }

    @keyframes idleFloat {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-3px) rotate(-1deg);
      }
    }

    @keyframes signalPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.86;
      }
      50% {
        transform: scale(1.24);
        opacity: 1;
      }
    }

    @keyframes blink {
      0%, 88%, 100% {
        transform: scaleY(1);
      }
      92%, 96% {
        transform: scaleY(0.12);
      }
    }

    @keyframes nudge {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes focusBreathe {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-2px) scale(1.015);
      }
    }

    @keyframes blinkCue {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      42% {
        transform: translateY(-2px) scale(1.025);
      }
      58% {
        transform: translateY(0) scale(0.995);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>

</head>
<body>
  <div class="shell">
    <aside class="companion booting settling" id="companion" title="双击隐藏 Mira">
      <div class="pet" aria-hidden="true">
        <div class="antenna"></div>
        <div class="face"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <div class="mouth"></div>
      </div>
      <div class="mira-bubble" id="miraBubble" aria-live="polite"><span id="miraBubbleText"></span></div>
      <div class="body">
        <strong id="title">Mira 很安静</strong>
        <p id="message">我会在旁边看着节奏，先轻提醒陪伴。</p>
        <span class="context-line" id="contextLine">舒适区 · L1 安静</span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="openBtn" type="button" title="打开 EyeFlow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </button>
        <button class="icon-btn" id="collapseBtn" type="button" title="收起 Mira">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
      </div>
    </aside>
  </div>

  <script>
    const moods = [
      ["", "Mira 很安静", "我会在旁边看着节奏，先轻提醒陪伴。"],
      ["focus", "Mira 陪你专注", "到恢复断点我再轻轻提示，不会突然打断。"],
      ["blink", "Mira 在提醒眨眼", "轻轻眨几次眼，让眼睛重新湿润一点。"],
      ["rest", "Mira 想让你恢复一下", "看远处 20 秒。"]
    ];
    let moodIndex = 0;
    let hasLiveState = false;
    let isExpanded = false;
    let dragState = null;
    let hoverOpenTimer = null;
    let hoverCloseTimer = null;
    let isHoveringCompanion = false;
    let theme = getTheme();
    const previewMood = getPreviewMood();
    let currentMood = previewMood || "";
    const compactPreview = new URLSearchParams(window.location.search).get("compact") === "1";
    const isDesktopShell = Boolean(window.eyeflowDesktop);
    const tapMoveThreshold = 8;
    const hoverOpenDelay = 120;
    const hoverCloseDelay = 1600;
    let bubbleTimer = null;
    let isMiraSpeaking = false;

    const companion = document.querySelector("#companion");
    const pet = document.querySelector(".pet");
    const title = document.querySelector("#title");
    const message = document.querySelector("#message");
    const contextLine = document.querySelector("#contextLine");
    const miraBubble = document.querySelector("#miraBubble");
    const miraBubbleText = document.querySelector("#miraBubbleText");

    function setMood(index) {
      moodIndex = index % moods.length;
      const [mood, label, copy] = moods[moodIndex];
      applyState({ mood, title: label, message: copy, allowSystemNotify: true });
    }


    function normalizeTheme(value) {
      if (value === "day" || value === "light") return "day";
      if (value === "night" || value === "dark") return "night";
      return "";
    }

    function applyTheme(nextTheme) {
      const safeTheme = normalizeTheme(nextTheme) || theme;
      if (safeTheme === theme && companion.classList.contains(`theme-${safeTheme}`)) return;
      theme = safeTheme;
      companion.classList.toggle("theme-day", theme === "day");
      companion.classList.toggle("theme-night", theme === "night");
    }

    function applyState(state) {
      const mood = state.mood === "calm" ? "" : state.mood || "";
      applyTheme(state.theme || state.appearanceTheme);
      currentMood = mood;
      const booting = companion.classList.contains("booting") ? "booting" : "";
      const ready = companion.classList.contains("ready") ? "ready" : "";
      const settling = companion.classList.contains("settling") ? "settling" : "";
      const expanded = companion.classList.contains("expanded") ? "expanded" : "";
      const speaking = companion.classList.contains("speaking") ? "speaking" : "";
      companion.className = `companion theme-${theme} ${mood} ${booting} ${ready} ${settling} ${expanded} ${speaking}`.trim();
      title.textContent = state.title || "Mira 很安静";
      message.textContent = mood === "rest"
        ? "看远处 20 秒。点我打开指引。"
        : state.message || "我会在旁边看着节奏，先轻提醒陪伴。";
      contextLine.textContent = state.continuityLine || `${state.loadZone || "舒适区"} · ${state.intensityLabel || "L1 安静"}`;
      // System notifications are delivered by the single coordinator in main.js
      // (applyInterventionBehavior). The companion window no longer fires its own —
      // that used to stack a banner on top of the bubble/island.
    }

    window.setInterval(() => {
      if (hasLiveState) return;
      setMood(moodIndex + 1);
    }, 90 * 1000);

    if (window.eyeflowDesktop?.onState) {
      window.eyeflowDesktop.onState((state) => {
        hasLiveState = true;
        applyState(state);
      });
    }

    if (window.eyeflowDesktop?.onCompanionExpanded) {
      window.eyeflowDesktop.onCompanionExpanded((expanded) => {
        syncExpanded(expanded);
      });
    }

    if (window.eyeflowDesktop?.onCompanionBubble) {
      window.eyeflowDesktop.onCompanionBubble((payload) => {
        setMiraBubble(payload);
      });
    }

    if (previewMood) {
      hasLiveState = true;
      const previewIndex = moods.findIndex(([mood]) => mood === previewMood);
      if (previewIndex >= 0) {
        moodIndex = previewIndex;
        const [mood, title, message] = moods[previewIndex];
        applyState({ mood, title, message });
      }
    }

    function getPreviewMood() {
      const previewMood = new URLSearchParams(window.location.search).get("mood");
      return ["focus", "blink", "rest"].includes(previewMood) ? previewMood : "";
    }

    function getTheme() {
      const previewTheme = new URLSearchParams(window.location.search).get("theme");
      if (previewTheme === "day" || previewTheme === "night") return previewTheme;
      try {
        const stored = normalizeTheme(localStorage.getItem("eyeflow-theme"));
        if (stored) return stored;
      } catch (_error) {}
      const hour = new Date().getHours();
      return hour >= 7 && hour < 19 ? "day" : "night";
    }

    function refreshTheme() {
      if (hasLiveState) return;
      const nextTheme = getTheme();
      applyTheme(nextTheme);
    }

    companion.classList.add(`theme-${theme}`);
    window.setInterval(refreshTheme, 60 * 1000);
    window.setTimeout(() => {
      companion.classList.remove("booting");
      companion.classList.add("ready");
      if (!isDesktopShell && !compactPreview) {
        window.setTimeout(() => setExpanded(true), 80);
      }
      window.setTimeout(() => {
        companion.classList.remove("settling");
      }, 180);
    }, 500);

    function syncExpanded(expanded) {
      isExpanded = Boolean(expanded);
      companion.classList.toggle("expanded", isExpanded);
    }

    function setMiraBubble(payload = {}) {
      const visible = Boolean(payload.visible);
      const text = String(payload.message || "").replace(/^Mira[：:]\s*/, "").trim();
      if (bubbleTimer) {
        window.clearTimeout(bubbleTimer);
        bubbleTimer = null;
      }
      if (!visible || !text) {
        isMiraSpeaking = false;
        companion.classList.remove("speaking");
        miraBubbleText.textContent = "";
        return;
      }
      isMiraSpeaking = true;
      clearHoverOpenTimer();
      clearHoverCloseTimer();
      isHoveringCompanion = false;
      setHovering(false);
      if (isExpanded) setExpanded(false);
      miraBubbleText.textContent = text;
      companion.classList.add("speaking");
      bubbleTimer = window.setTimeout(() => {
        isMiraSpeaking = false;
        companion.classList.remove("speaking");
        miraBubbleText.textContent = "";
        bubbleTimer = null;
      }, 8000);
    }

    async function setExpanded(expanded) {
      const nextExpanded = Boolean(expanded);
      if (nextExpanded && isMiraSpeaking) {
        syncExpanded(false);
        return;
      }
      companion.classList.add("settling");
      if (isDesktopShell && window.eyeflowDesktop?.setCompanionExpanded) {
        try {
          const result = await window.eyeflowDesktop.setCompanionExpanded(nextExpanded);
          syncExpanded(result?.expanded ?? nextExpanded);
        } catch {
          syncExpanded(nextExpanded);
        }
      } else {
        syncExpanded(nextExpanded);
      }
      window.setTimeout(() => {
        companion.classList.remove("settling");
      }, 180);
    }

    function toggleExpanded() {
      if (isMiraSpeaking) return;
      setExpanded(!isExpanded);
    }

    function clearHoverOpenTimer() {
      if (!hoverOpenTimer) return;
      window.clearTimeout(hoverOpenTimer);
      hoverOpenTimer = null;
    }

    function clearHoverCloseTimer() {
      if (!hoverCloseTimer) return;
      window.clearTimeout(hoverCloseTimer);
      hoverCloseTimer = null;
    }

    function setHovering(hovering) {
      if (isDesktopShell) {
        window.eyeflowDesktop?.setCompanionHover?.("avatar", hovering);
      }
    }

    function releaseMouseFocus(event) {
      if (event.detail > 0) event.currentTarget.blur();
    }

    document.querySelector("#openBtn").addEventListener("click", (event) => {
      releaseMouseFocus(event);
      openDashboard();
    });

    document.querySelector("#collapseBtn").addEventListener("click", (event) => {
      releaseMouseFocus(event);
      setExpanded(false);
    });

    document.querySelector(".body").addEventListener("click", () => {
      openDashboard();
    });

    companion.addEventListener("dblclick", (event) => {
      if (isDesktopShell) {
        event.preventDefault();
        event.stopPropagation();
        clearHoverOpenTimer();
        clearHoverCloseTimer();
        setHovering(false);
        setExpanded(false);
        window.eyeflowDesktop?.setCompanionVisible?.(false)
          || window.eyeflowDesktop?.hideCompanion?.();
        return;
      }
      openDashboard();
    });

    companion.addEventListener("mousedown", (event) => {
      if (event.button !== 0) return;
      clearHoverOpenTimer();
      clearHoverCloseTimer();
      dragState = {
        startX: event.screenX,
        startY: event.screenY,
        lastX: event.screenX,
        lastY: event.screenY,
        moved: false
      };
    });

    window.addEventListener("mousemove", (event) => {
      if (!dragState) return;
      const dx = event.screenX - dragState.lastX;
      const dy = event.screenY - dragState.lastY;
      const totalX = event.screenX - dragState.startX;
      const totalY = event.screenY - dragState.startY;
      if (Math.hypot(totalX, totalY) > tapMoveThreshold) {
        dragState.moved = true;
        companion.classList.add("dragging");
      }
      dragState.lastX = event.screenX;
      dragState.lastY = event.screenY;
      if (dragState.moved && window.eyeflowDesktop?.moveCompanionBy) {
        window.eyeflowDesktop.moveCompanionBy({ x: dx, y: dy });
      }
    });

    window.addEventListener("mouseup", (event) => {
      if (!dragState) return;
      const wasDrag = dragState.moved;
      dragState = null;
      companion.classList.remove("dragging");
      if (!wasDrag && event.target.closest(".pet")) {
        event.preventDefault();
        if (isDesktopShell && currentMood === "rest") {
          openDashboard({ restGuide: true });
          return;
        }
        if (isMiraSpeaking) return;
        toggleExpanded();
      }
    });

    window.addEventListener("blur", () => {
      clearHoverOpenTimer();
      clearHoverCloseTimer();
      isHoveringCompanion = false;
      dragState = null;
      companion.classList.remove("dragging");
    });

    // Mira's bubble opens on an explicit click of the avatar (see the mouseup
    // handler → toggleExpanded), not on hover. Scheduled reminders still pop on
    // their own via the speaking bubble and the intervention auto-panel.

    function openDashboard(options = {}) {
      if (window.eyeflowDesktop) {
        const shouldFocusManualStart = !options.restGuide && !options.view && !options.focus;
        const dashboardOptions = shouldFocusManualStart
          ? { view: "todayView", focus: "manualStart" }
          : options;
        window.eyeflowDesktop.showDashboard(dashboardOptions);
        return;
      }
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
